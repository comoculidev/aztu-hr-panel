<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Kadr şəkli — AzTU HR paneli</title>
  <script src="/static/tema.js"></script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/ikon.svg" type="image/svg+xml">
</head>
<body>
  <main class="sekil-sehife">
    <div class="marka">
      <div class="marka-isare">Az</div>
      <div><b>AzTU</b><small>Kadr şəkli</small></div>
    </div>
    <section class="sekil-kart" id="kart" aria-live="polite">
      <div class="yuklenir" id="yuklenir">Yüklənir…</div>

      <div class="gizli" id="forma">
        <h1 id="ad"></h1>
        <p class="alt-metn">Üzünüz kameraya düz baxsın, işıq qarşıdan düşsün, eynək və papaq olmasın.</p>
        <div class="sekil-onizleme" id="onizleme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        </div>
        <input type="file" id="fayl" accept="image/*" capture="user" class="gizli">
        <button class="dugme esasli genis" type="button" id="cek">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span>Şəkil çək</span>
        </button>
        <button class="dugme esasli genis gizli" type="button" id="gonder">Kadrı əlavə et</button>
        <div class="xeta-qutu gizli" id="xeta" role="alert"></div>
      </div>

      <div class="gizli netice" id="ugur">
        <div class="netice-isare ok">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg>
        </div>
        <h1>Şəkil qəbul olundu</h1>
        <p class="alt-metn">Təşəkkür edirik. Bu səhifəni bağlaya bilərsiniz.</p>
      </div>

      <div class="gizli netice" id="bagli">
        <div class="netice-isare xeta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 7v6M12 17h.01"/></svg>
        </div>
        <h1>Link işləmir</h1>
        <p class="alt-metn" id="bagli-metn"></p>
      </div>
    </section>
  </main>
  <script src="/static/sekil.js"></script>
</body>
</html>
